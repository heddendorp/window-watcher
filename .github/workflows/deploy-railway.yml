name: Deploy Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: f584dbe5-aff5-4282-b423-0e7a874e9028
      RAILWAY_SERVICE_ID: 42cf18f5-12d3-4e81-93f1-a15a9f2bc408
      RAILWAY_SAMPLER_SERVICE_ID: 5e0f161c-f809-40a0-bec6-6754febecf1e
      RAILWAY_ENVIRONMENT: production
      APP_VERSION_URL: https://window-watcher-production.up.railway.app/app-version.json
    steps:
      - name: Check Railway token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is required for production deployments."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.26.0

      - name: Verify Railway service configuration
        run: |
          web_deployment="$(railway deployment list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SERVICE_ID" \
            --limit 1 \
            --json)"
          sampler_deployment="$(railway deployment list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SAMPLER_SERVICE_ID" \
            --limit 1 \
            --json)"
          web_variables="$(railway variable list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SERVICE_ID" \
            --json)"
          sampler_variables="$(railway variable list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SAMPLER_SERVICE_ID" \
            --json)"

          if ! printf '%s' "$web_deployment" | jq -e '
              .[0] |
              ((.meta.serviceManifest.deploy.sleepApplication // false) == false) and
              ([ .meta.serviceManifest.deploy.multiRegionConfig[].numReplicas ] | add == 1) and
              (.meta.volumeMounts | contains(["/data"]))
            ' >/dev/null ||
            ! printf '%s' "$sampler_deployment" | jq -e '
              .[0] |
              .status == "SUCCESS" and
              .meta.image == "curlimages/curl:8.11.1" and
              .meta.serviceManifest.deploy.cronSchedule == "*/10 * * * *" and
              .meta.serviceManifest.deploy.restartPolicyType == "NEVER" and
              .meta.serviceManifest.deploy.multiRegionConfig == {
                "europe-west4-drams3a": { "numReplicas": 1 }
              }
            ' >/dev/null ||
            ! printf '%s' "$web_variables" | jq -e '
              .BACKGROUND_SAMPLER == "false" and
              .RAILWAY_VOLUME_MOUNT_PATH == "/data" and
              (.TADO_HOME_ID | type == "string" and length > 0) and
              has("SAMPLE_TRIGGER_TOKEN") and
              (has("TADO_TOKEN_JSON") | not)
            ' >/dev/null ||
            ! printf '%s' "$sampler_variables" | jq -e '
              .SAMPLE_URL == "https://window-watcher-production.up.railway.app/api/sample" and
              has("SAMPLE_TRIGGER_TOKEN")
            ' >/dev/null
          then
            echo "::error::Railway web/sampler configuration has drifted."
            exit 1
          fi

          unset web_variables sampler_variables

          expected_sampler_command="$(cat scripts/railway-sampler-command.txt)"
          actual_sampler_command="$(printf '%s' "$sampler_deployment" | jq -r \
            '.[0].meta.serviceManifest.deploy.startCommand // ""')"
          if [ "$actual_sampler_command" != "$expected_sampler_command" ]; then
            echo "::error::Railway sampler command differs from scripts/railway-sampler-command.txt."
            exit 1
          fi

      - name: Set deployment version
        run: |
          railway variable set \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SERVICE_ID" \
            --skip-deploys \
            "WINDOW_WATCHER_BUILD_SHA=$GITHUB_SHA"

      - name: Deploy to Railway
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SERVICE_ID" \
            --ci \
            -m "github actions deploy $GITHUB_SHA"

      - name: Verify production commit
        run: |
          for attempt in {1..12}; do
            deployed_version="$(curl -fsS "$APP_VERSION_URL" | jq -r '.version // empty' || true)"
            if [ "$deployed_version" = "$GITHUB_SHA" ]; then
              echo "Production is serving $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done

          echo "::error::Production did not serve $GITHUB_SHA within 60 seconds."
          exit 1
