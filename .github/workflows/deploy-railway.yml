name: Deploy Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: f584dbe5-aff5-4282-b423-0e7a874e9028
      RAILWAY_SERVICE_ID: 42cf18f5-12d3-4e81-93f1-a15a9f2bc408
      RAILWAY_SAMPLER_SERVICE_ID: 5e0f161c-f809-40a0-bec6-6754febecf1e
      RAILWAY_ENVIRONMENT: production
      APP_VERSION_URL: https://window-watcher-production.up.railway.app/app-version.json
    steps:
      - name: Check Railway token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is required for production deployments."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.26.0

      - name: Verify Railway service configuration
        run: |
          railway link \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT"

          railway_config="$(railway environment config \
            --environment "$RAILWAY_ENVIRONMENT" \
            --json)"
          shared_token_reference='$'"{{shared.SAMPLE_TRIGGER_TOKEN}}"

          if ! printf '%s' "$railway_config" | jq -e \
              --arg web "$RAILWAY_SERVICE_ID" \
              --arg sampler "$RAILWAY_SAMPLER_SERVICE_ID" \
              --arg sharedTokenReference "$shared_token_reference" '
                .services[$web].deploy as $webDeploy |
                .services[$sampler] as $samplerService |
                $samplerService.deploy as $samplerDeploy |
                (($webDeploy.sleepApplication // false) == false) and
                ([ $webDeploy.multiRegionConfig[].numReplicas ] | add == 1) and
                ($samplerDeploy.cronSchedule == "*/10 * * * *") and
                ($samplerDeploy.restartPolicyType == "NEVER") and
                ($samplerService.source.image == "curlimages/curl:8.11.1") and
                (.services[$web].source.repo == "heddendorp/window-watcher") and
                ([ .services[$web].volumeMounts[].mountPath ] | contains(["/data"])) and
                (.services[$web].variables.BACKGROUND_SAMPLER.value == "false") and
                (.services[$web].variables.RAILWAY_VOLUME_MOUNT_PATH.value == "/data") and
                (.services[$web].variables.TADO_HOME_ID.value | length > 0) and
                (.sharedVariables.SAMPLE_TRIGGER_TOKEN.isSealed == true) and
                (.services[$web].variables.SAMPLE_TRIGGER_TOKEN.value == $sharedTokenReference) and
                ($samplerService.variables.SAMPLE_TRIGGER_TOKEN.value == $sharedTokenReference) and
                ($samplerService.variables.SAMPLE_URL.value == "https://window-watcher-production.up.railway.app/api/sample") and
                (.services[$web].variables | has("TADO_TOKEN_JSON") | not)
              ' >/dev/null
          then
            echo "::error::Railway web/sampler configuration has drifted."
            exit 1
          fi

          expected_sampler_command="$(cat scripts/railway-sampler-command.txt)"
          actual_sampler_command="$(printf '%s' "$railway_config" | jq -r \
            --arg sampler "$RAILWAY_SAMPLER_SERVICE_ID" \
            '.services[$sampler].deploy.startCommand // ""')"
          if [ "$actual_sampler_command" != "$expected_sampler_command" ]; then
            echo "::error::Railway sampler command differs from scripts/railway-sampler-command.txt."
            exit 1
          fi

      - name: Set deployment version
        run: |
          railway variable set \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SERVICE_ID" \
            --skip-deploys \
            "WINDOW_WATCHER_BUILD_SHA=$GITHUB_SHA"

      - name: Deploy to Railway
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_SERVICE_ID" \
            --ci \
            -m "github actions deploy $GITHUB_SHA"

      - name: Verify production commit
        run: |
          for attempt in {1..12}; do
            deployed_version="$(curl -fsS "$APP_VERSION_URL" | jq -r '.version // empty' || true)"
            if [ "$deployed_version" = "$GITHUB_SHA" ]; then
              echo "Production is serving $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done

          echo "::error::Production did not serve $GITHUB_SHA within 60 seconds."
          exit 1
